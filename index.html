<style>
:root{--bg:#fff;--surface:#fff;--ink:#111;--mut:#5a5a5a;--line:#e8e8ea;--panel:#faf8f6;--road:#1d1d1f;--soft:#fff1e6;--or:#ff6a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e10;--surface:#18181b;--ink:#f4f4f5;--mut:#a1a1aa;--line:#2a2a2e;--panel:#141416;--road:#3b3b40;--soft:#2a1b10;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0e10;--surface:#18181b;--ink:#f4f4f5;--mut:#a1a1aa;--line:#2a2a2e;--panel:#141416;--road:#3b3b40;--soft:#2a1b10;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding:20px 18px 28px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px}
h1{margin:0;font-size:clamp(22px,4vw,40px);font-weight:800;line-height:1.15}
h1 span{color:var(--or)}
.sub{margin:6px 0 0;color:var(--mut);font-size:clamp(13px,1.8vw,17px)}
.bar{width:84px;height:6px;border-radius:3px;background:var(--or);margin-top:12px}
.logo{height:clamp(52px,8vw,84px);display:block;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 2px 14px rgba(0,0,0,.12)}
.mapbox{margin-top:18px;border:1px solid var(--line);border-radius:22px;background:var(--panel);padding:6px;overflow:hidden}
svg{display:block;width:100%;height:auto;font-family:'Poppins',system-ui,sans-serif}
#road{fill:none;stroke:var(--road);stroke-width:78;stroke-linecap:round;transition:stroke-dashoffset 1.6s ease}
#prog{fill:none;stroke:var(--or);stroke-width:78;stroke-linecap:round}
#lane{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:3 16;stroke-linecap:round;opacity:0;transition:opacity .6s 1.4s}
.ready #lane{opacity:.7}
.st{cursor:pointer;outline:none}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .55s var(--d) both cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.sc{transform-box:fill-box;transform-origin:center;transition:transform .3s}
.st:hover .sc,.st:focus-visible .sc{transform:scale(1.1)}
.st.on .sc{transform:scale(1.2)}
.halo{fill:var(--or);opacity:0;transform-box:fill-box;transform-origin:center}
.st.on .halo{animation:pulse 1.6s infinite}
@keyframes pulse{0%{opacity:.35;transform:scale(.9)}100%{opacity:0;transform:scale(1.35)}}
.in{fill:var(--surface)}
.lbl{font-size:25px;font-weight:700;text-anchor:middle;fill:var(--ink)}
.st.on .lbl{fill:var(--or)}
.bn{font-size:15px;font-weight:800;text-anchor:middle;dominant-baseline:central}
.bob{animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-8px)}}
#pin{opacity:0;transition:opacity .5s 1.6s}.ready #pin{opacity:1}
#pin.jump .bob{animation:jump .6s ease-in-out infinite alternate}
@keyframes jump{from{transform:translateY(0)}to{transform:translateY(-44px)}}
.card{margin-top:16px;border:1px solid var(--line);border-top:6px solid var(--ac,#ff6a00);border-radius:22px;background:var(--surface);padding:clamp(16px,3vw,28px);display:grid;gap:14px;animation:fadeup .4s}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.head{display:flex;gap:16px;align-items:center}
.cn{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:24px;color:#fff;background:linear-gradient(160deg,#111 0%,#ff6a00 100%)}
h2{margin:0;font-size:clamp(20px,3vw,28px);font-weight:800}
.card.fin h2{color:var(--or)}
.head p{margin:2px 0 0;color:var(--mut)}
.say{display:flex;align-items:center;gap:12px}
.say img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:3px solid var(--or);flex:none}
.say span{background:var(--soft);border-radius:18px;padding:8px 16px;font-weight:600}
ul{margin:0;padding-left:22px;display:grid;gap:8px}
li::marker{color:var(--or)}
code{background:var(--soft);padding:1px 6px;border-radius:6px;font-size:.92em}
.tip{background:var(--soft);border-left:5px solid var(--or);border-radius:10px;padding:10px 14px;font-size:14.5px}
.tip.ok{border-left-color:#22c55e;background:rgba(34,197,94,.12)}
details{border:1px solid var(--line);border-radius:12px;padding:10px 14px}
summary{cursor:pointer;font-weight:600}
details p{margin:8px 0 0;color:var(--mut)}
.code{position:relative;background:#111;color:#f4f4f5;border-radius:14px;padding:14px 16px}
.code pre{margin:0;white-space:pre-wrap;font:13.5px/1.6 ui-monospace,Menlo,Consolas,monospace;padding-right:76px}
.cp{position:absolute;top:10px;right:10px;padding:6px 14px;font-size:13px}
.imgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.imgs:empty,#codebox:empty{display:none}
figure{margin:0}
figure img{width:100%;border-radius:12px;border:1px solid var(--line);display:block}
figure.hi img{border:3px solid var(--or)}
figure.hi figcaption{color:var(--or);font-weight:700}
figcaption{font-size:13px;color:var(--mut);margin-top:6px}
nav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:10px 20px;cursor:pointer;background:var(--or);color:#fff;transition:transform .15s,opacity .15s}
button:hover:not(:disabled){transform:translateY(-2px)}
button:disabled{opacity:.35;cursor:default}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--line);cursor:pointer;transition:all .25s}
.dots i.d{background:#111}
:root[data-theme="dark"] .dots i.d{background:#888}
.dots i.on{background:var(--or);transform:scale(1.5)}
footer{margin-top:18px;text-align:center;font-size:13px;color:var(--mut)}
footer b{color:var(--ink)}
.ck{display:none}.st.done .ck{display:inline}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2s ease-in-out infinite alternate}@keyframes tw{from{opacity:.2;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
.fl{animation:fl 3s ease-in-out infinite alternate}@keyframes fl{to{transform:translateY(-14px)}}
.dr{animation:dr 10s ease-in-out infinite alternate}@keyframes dr{to{transform:translateX(40px)}}
.dl{display:inline-block;margin:8px 0 4px;padding:11px 18px;border-radius:999px;background:var(--or);color:#fff;font-weight:700;font-size:15px;text-decoration:none}
.mus{position:relative}.mus.off{opacity:.7}.mus.off::after{content:'';position:absolute;left:9px;right:9px;top:50%;height:3px;border-radius:2px;background:var(--or);transform:rotate(-38deg)}
.fz{color:var(--or);font-size:12px;letter-spacing:.03em}
.hr{display:flex;align-items:center;gap:10px;margin-left:auto;margin-right:10px}
.snd{padding:8px 12px;background:var(--soft);color:var(--ink);font-size:16px}
header{flex-wrap:nowrap}
.ph{border:2px dashed var(--line);border-radius:12px;padding:30px 12px;text-align:center;color:var(--mut);font-size:13px;background:var(--panel)}
@media (max-width:720px){.wrap{padding:12px 12px 90px}h1{font-size:19px}.sub{display:none}.logo{height:44px}.mapbox{overflow:visible;padding:2px;margin-top:10px}#map{width:100%}.lbl,#bubr,#bubt{display:none}.sc{transform:scale(1.7)}.st.on .sc{transform:scale(2.1)}.cn{width:44px;height:44px;font-size:17px}.card{margin-top:10px}nav{flex-wrap:nowrap;position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}nav button{padding:10px 16px}#cnt{font-size:13px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#pin,#lane{opacity:1}}
</style>

{t:"Kenalan 3 alat",d:"Paham tugas tiap alat sebelum mulai.",b:["<b>Firebase</b>: gudang data dan login milik Google. Gratis di paket Spark.","<b>GitHub</b>: tempat menyimpan file kode kamu di internet.","<b>Vercel</b>: penayang. Mengambil kode dari GitHub, lalu memberi link <code>.vercel.app</code>.","<b>Web app</b>: aplikasi yang dibuka lewat link di browser, seperti website.","Siapkan akun Google, akun GitHub, akun Vercel (daftar pakai GitHub), dan <b>Node.js</b> untuk tes di komputer.","Buat satu folder proyek, misalnya <code>web-app-ku</code>."],tip:"<b>Yang kamu butuhkan:</b> akun AI (Claude, Gemini, atau ChatGPT) untuk menulis kode, laptop atau PC, dan internet.",ok:"Semua akun siap dan folder proyek sudah dibuat."},
{t:"Konsep dan AI",d:"Susun rancangan, lalu biarkan AI menulis kodenya.",b:["Pilih <b>SATU</b> ide sederhana (contoh: katalog lagu, daftar produk, daftar tugas).","<b>PRD</b> = dokumen blueprint: aplikasinya apa, halamannya apa, datanya apa. Minta AI menyusunnya.","Pasang skill Asix: <b>[LINK_SKILL]</b>. Ceritakan idemu dan jawab pertanyaannya.","Minta prompt untuk AI penulis kode, lalu tempel ke AI pembuat kode.","Simpan semua file hasilnya di folder proyek, sesuai nama dan foldernya."],tip:"⚠️ Isi [LINK_SKILL] dengan link skill yang kamu pakai. Minta AI menandai bagian yang harus kamu isi sendiri, yaitu config Firebase.",ok:"Folder proyek berisi semua file dari AI."},
{t:"Buat project",d:"Buat project Firebase di console.",b:["Buka <b>console.firebase.google.com</b> dan login dengan akun Google.","Klik <b>Create a project</b> (Buat project).","Isi nama project (huruf kecil, contoh: <code>web-app-ku</code>), lalu ikuti sampai selesai. Kalau ditanya Google Analytics, boleh dimatikan.","Cek pojok kiri bawah: harus tertulis <b>Spark</b> (No-cost)."],tip:"💡 Spark = paket gratis. Kamu tidak perlu upgrade untuk belajar.",ok:"Halaman project Firebase terbuka.",imgs:[["a","Buat project baru di Firebase."]]},
{t:"Daftar web app",d:"Daftarkan web app dan salin config-nya.",b:["Di halaman project, klik ikon web <b>&lt;/&gt;</b>.","Beri nama app, lalu klik <b>Register app</b> (Daftarkan app).","Muncul kode <code>firebaseConfig</code> yang berisi apiKey, projectId, dan lainnya. Salin.","Tempel ke file config di folder proyek (tanya AI file yang mana)."],tip:"💡 Config ini memang terlihat publik di web app. Yang menjaga datamu adalah Rules (langkah 7), bukan menyembunyikan config.",ok:"firebaseConfig sudah tertempel di file config.",imgs:[["b","Ikon web </> dan kode firebaseConfig."]]},
{t:"Firestore",d:"Buat database tempat data disimpan.",b:["Di menu kiri, buka <b>Databases &amp; Storage → Firestore</b>.","Klik <b>Create database</b> (Buat database).","Pilih lokasi yang dekat dengan pengguna kamu.","Pilih mode <b>produksi</b>. Aturan keamanannya kita pasang sendiri di langkah 7."],tip:"⚠️ Lokasi database tidak bisa diubah setelah dibuat. Pilih dengan teliti.",ok:"Firestore Database aktif dan masih kosong.",imgs:[["c","Menu Firestore dan tombol Create database."]]},
{t:"Login Google",d:"Aktifkan login Google untuk admin.",b:["Di menu kiri, klik <b>Authentication</b>. Kalau ada tombol <b>Get started</b>, klik.","Buka tab <b>Sign-in method</b>.","Klik <b>Google</b>, geser tombol <b>Enable</b>, pilih email dukungan project, lalu <b>Save</b>."],tip:"💡 Abaikan <b>Add new provider</b> dan kotak SMS Multi-factor. Kamu cuma butuh Google.",ok:"Di daftar Sign-in providers, Google berstatus Enabled.",imgs:[["d","Google berstatus Enabled.",1]]},
{t:"Rules",d:"Pasang gembok keamanan untuk datamu.",b:["Buka <b>Firestore → tab Rules</b>.","Hapus isi lama, lalu tempel isi file <code>firestore.rules</code> dari AI.","Pastikan email admin di Rules <b>sama persis</b> dengan <code>ADMIN_EMAIL</code> di file config.","Klik <b>Publish</b> (atau tekan <b>Ctrl + S</b> di editor Rules)."],tip:"⚠️ Rules adalah gembok datamu: semua orang boleh baca, hanya admin yang boleh menulis. Jangan pakai aturan <code>allow read, write: if true</code>.",ok:"Rules tersimpan. Di riwayat versi, yang terbaru bertanda bintang.",imgs:[["e","Tab Rules dengan riwayat versi."]]},
{t:"Tes di komputer",d:"Jalankan aplikasi di komputer sebelum online.",b:["Buka folder proyek di File Explorer, klik kotak alamat, ketik <code>cmd</code>, lalu Enter.","Ketik perintah di bawah, lalu Enter. Kalau muncul <i>Ok to proceed?</i>, ketik <code>y</code>.","Buka <code>http://localhost:3000</code> di Chrome (bukan alamat Network).","Buka <code>http://localhost:3000/#admin</code> dan login dengan akun Google admin."],code:"npx serve .",tip:"⚠️ Jangan klik dua kali <code>index.html</code>, harus lewat server. Jangan tutup jendela hitam selama tes (berhenti dengan Ctrl + C).",ok:"Aplikasi tampil dan login admin berhasil.",imgs:[["f","Jendela hitam: Serving! dan alamat localhost."]]},
{t:"Buat indeks",d:"Beri Firestore indeks untuk filter dan urutan.",b:["Kalau ada daftar yang difilter dan diurutkan (contoh: per playlist), Firestore bisa menolak dengan pesan <i>The query requires an index</i>.","Tekan <b>F12</b>, buka tab <b>Console</b>, lalu klik link biru di pesan error itu.","Di Firebase, klik <b>Create</b> tanpa mengubah isian.","Tunggu status <b>Building</b> berubah jadi <b>Enabled</b>, lalu tekan <b>F5</b> di aplikasi."],tip:"💡 Cukup sekali. Peringatan Tailwind dan Cross-Origin di Console boleh diabaikan.",ok:"Daftar yang tadi error sekarang tampil.",imgs:[["g","Dialog Create index dan status Enabled."]]},
{t:"Push ke GitHub",d:"Unggah file proyek ke GitHub.",b:["Buka <b>github.com</b>, klik <b>+ → New repository</b>. Isi nama (contoh: <code>web-app-ku</code>), jangan centang README, lalu <b>Create repository</b>.","Klik link <b>uploading an existing file</b>.","Di File Explorer, pilih semua isi folder proyek (Ctrl + A), lalu <b>seret</b> ke kotak upload. Folder ikut terbawa.","Cek daftar: nama file harus berawalan folder (contoh <code>js/app.js</code>) dan tidak ada yang dobel.","Klik <b>Commit changes</b>."],tip:"⚠️ Seret <b>foldernya</b>, jangan masuk ke dalam folder lalu upload isinya. Hasil benar: folder dan file tampil langsung di halaman depan repo, bukan di dalam satu folder lagi.",ok:"Halaman depan repo menampilkan folder dan file proyek.",imgs:[["h","Daftar upload sebelum Commit changes."],["i","Halaman depan repo setelah commit."]]},
{t:"Deploy Vercel",d:"Tayangkan web app dari GitHub ke Vercel.",b:["Buka <b>vercel.com</b>, login dengan GitHub.","Klik <b>Add New → Project</b>, lalu <b>Import</b> repo kamu.","Isi <b>Framework Preset</b> = <b>Other</b>. Kosongkan Build Command dan Output Directory.","Klik <b>Deploy</b>. Setelah selesai, catat alamat <code>nama-app.vercel.app</code>."],tip:"💡 Repo tidak muncul di daftar? Klik <b>Adjust GitHub App Permissions</b>, lalu izinkan repo-nya.",ok:"Muncul tulisan Deployed to Production dan alamat .vercel.app.",imgs:[["j","Halaman Deployed to Production."]]},
{t:"Domain dan tes HP",d:"Izinkan alamat Vercel, lalu tes di HP.",b:["Di Firebase, buka <b>Authentication → Settings → Authorized domains</b>.","Klik <b>Add domain</b>, isi alamat Vercel <b>tanpa</b> https://, lalu simpan.","Di HP, buka <code>https://nama-app.vercel.app/#admin</code> dan login dengan Google.","Kalau masih muncul pesan domain belum ada, tunggu 2 sampai 3 menit, lalu tekan tombol masuk lagi.","Coba semua fitur di HP."],code:"nama-app.vercel.app",tip:"⚠️ Login di localhost tidak ikut ke Vercel. Login ulang sekali di alamat Vercel.",ok:"Login admin berhasil di HP lewat link Vercel.",imgs:[["k","Authorized domains berisi alamat Vercel."],["l","Panel admin terbuka di HP."]]},
{t:"Hore, web app kamu online!",d:"Selamat! Kamu sudah sampai di garis finis.",b:["Bagikan link <code>.vercel.app</code> ke teman atau pelanggan.","<b>Update:</b> ubah file, upload ulang ke GitHub dengan nama dan lokasi yang sama. Vercel deploy otomatis.","Kalau tampilan belum berubah, tekan <b>Ctrl + Shift + R</b> (refresh keras)."],tip:"Satu web app yang jalan lebih baik daripada sepuluh ide yang tertunda.",fin:1,faq:[["Layar putih saat tes di komputer?","Biasanya <code>index.html</code> dibuka dengan klik dua kali. Jalankan lewat <code>npx serve .</code> (langkah 8)."],["Muncul pesan unauthorized-domain?","Alamat belum ada di Authorized domains. Lihat langkah 12."],["Muncul pesan permission-denied?","Kamu belum login admin, email beda dengan <code>ADMIN_EMAIL</code>, atau Rules belum di-Publish."],["Muncul pesan butuh indeks?","Klik link di Console dan buat indeksnya (langkah 9)."],["Aman kalau config Firebase terlihat publik?","Aman, selama Rules benar. Yang menjaga data adalah Rules, bukan config."],["Repo GitHub sebaiknya Public atau Private?","Kalau Public, isi file (termasuk email admin di config) bisa dibaca orang. Ubah di <b>Settings repo → Danger Zone → Change visibility</b>. Vercel tetap bisa deploy repo Private."],["Apakah harus bayar?","Paket gratis cukup untuk belajar, tapi ada batas pemakaian harian. Pantau di <b>Firestore → Usage</b>."]]}
];

S[2].b=["Buka <b>console.firebase.google.com</b> dan login dengan akun Google.", "Klik <b>Get started by setting up a Firebase project</b> (atau <b>Create a project</b>).", "Isi nama project (huruf kecil, contoh: <code>asix-belajar-piano</code>), centang <b>I accept the Firebase terms</b>, lalu klik <b>Continue</b>.", "Layar Gemini dan Google Analytics tidak dipakai di peta ini. Boleh matikan toggle-nya, lalu klik <b>Continue</b> dan <b>Create project</b>.", "Tunggu <i>Provisioning resources</i> sampai muncul <b>Your Firebase project is ready</b>, lalu klik <b>Continue</b>.", "Cek di halaman project: tertulis <b>Spark plan</b> (No-cost)."];
S[3].b=["Di halaman project, klik <b>+ Add app</b>, lalu pilih ikon web <b>&lt;/&gt;</b>.", "Beri nama app. <b>Jangan</b> centang Firebase Hosting. Klik <b>Register app</b>.", "Di layar <b>Add Firebase SDK</b>, abaikan pilihan npm atau script tag. Salin bagian <code>const firebaseConfig = {...}</code> saja.", "Tempel ke file config di folder proyek (tanya AI file yang mana), lalu klik <b>Continue to console</b>."];
S[4].b=["Menu kiri <b>Databases &amp; Storage → Firestore</b>, klik <b>Create database</b>.", "<b>Select edition:</b> biarkan <b>Standard edition</b>, klik Next.", "<b>Database ID &amp; location:</b> biarkan <code>(default)</code>, pilih lokasi terdekat (contoh <code>asia-southeast2 (Jakarta)</code>), klik Next.", "<b>Configure:</b> pilih <b>Start in production mode</b>, klik Next.", "<b>Scheduled backups:</b> abaikan (butuh paket Blaze), lalu klik <b>Create</b>."];
S[4].ok="Halaman Firestore Data terbuka dengan tulisan Your database is ready to go.";
S[5].b=["Di menu kiri klik <b>Security → Authentication</b>. Klik <b>Get started</b>.", "Buka tab <b>Sign-in method</b>, lalu klik <b>Google</b>.", "Geser tombol <b>Enable</b>, pilih <b>Support email</b> (wajib, kalau kosong tombol Save tidak aktif), lalu <b>Save</b>."];
S[5].tip="💡 Abaikan pesan SHA-1 (untuk app Android), tombol <b>Add new provider</b>, dan kotak SMS Multi-factor.";

function mnote(t,f,ty,g,a,d,out){const o=mc.createOscillator(),e=mc.createGain();o.type=ty;o.frequency.value=f;e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+a);e.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(e);e.connect(out);o.start(t);o.stop(t+d+.1)}
function mbar(){if(!mc||!mus)return;const t=mc.currentTime+.05,k=mi++%4;CH[k].forEach(n=>mnote(t,mtof(n),'triangle',.05,1.4,5.2,mf1));mnote(t,mtof(RT[k]),'sine',.12,.05,3.8,mm);for(let i=0;i<6;i++)mnote(t+.5+i*.62+Math.random()*.15,mtof(PN[Math.floor(Math.random()*5)]),'sine',.045,.01,1.6,mdl);mt=setTimeout(mbar,3900)}
function mstart(){if(!mus||mrun)return;mrun=true;try{mc=new(window.AudioContext||window.webkitAudioContext)();mm=mc.createGain();mm.gain.value=MV*4.2;mm.connect(mc.destination);mf1=mc.createBiquadFilter();mf1.type='lowpass';mf1.frequency.value=1000;mf1.connect(mm);mdl=mc.createGain();mdl.connect(mm);const dl=mc.createDelay(1),fb=mc.createGain();dl.delayTime.value=.42;fb.gain.value=.38;mdl.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(mm);mc.resume();mbar()}catch(e){mrun=false}}
function mset(on){mus=on;try{localStorage.setItem('asixMus',on?'1':'0')}catch(e){}$('mus').classList.toggle('off',!on);$('mus').setAttribute('aria-pressed',on);if(on){if(!mrun)mstart();else{mc.resume();clearTimeout(mt);mbar()}}else{clearTimeout(mt);if(mc)mc.suspend()}}
$('mus').classList.toggle('off',!mus);$('mus').setAttribute('aria-pressed',mus);$('mus').onclick=()=>mset(!mus);
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,function f(){removeEventListener(ev,f,true);mstart()},true));
document.addEventListener('visibilitychange',()=>{if(!mc||!mus)return;clearTimeout(mt);if(document.hidden)mc.suspend();else{mc.resume();mbar()}});
function go(n){n=Math.max(0,Math.min(S.length-1,n));tone(n===S.length-1?988:392+n*28,n===S.length-1?.5:.12);const from=pos,to=LEN[n],t0=performance.now(),dur=reduce?0:Math.min(1500,300+Math.abs(to-from)*.6);cur=n;render();cancelAnimationFrame(raf);
(function f(t){const k=dur?Math.min(1,(t-t0)/dur):1,e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;pos=from+(to-from)*e;place(pos,dur?Math.abs(Math.sin(k*Math.PI*Math.max(1,Math.round(Math.abs(to-from)/300))))*26:0);if(k<1)raf=requestAnimationFrame(f);else if(dur&&to!==from)burst(P[n][0],P[n][1],n===S.length-1)})(t0)}
sts.addEventListener('click',e=>{const g=e.target.closest('.st');if(g)go(+g.dataset.i)});
sts.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const g=e.target.closest('.st');if(g){e.preventDefault();go(+g.dataset.i)}}});
dots.addEventListener('click',e=>{if(e.target.dataset.i)go(+e.target.dataset.i)});
$('prev').onclick=()=>go(cur-1);$('next').onclick=()=>go(cur+1);
addEventListener('keydown',e=>{if(e.target.closest('summary'))return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
place(pos);render();
requestAnimationFrame(()=>{road.style.strokeDashoffset=0;document.body.classList.add('ready')});
